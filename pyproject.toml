[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cipherrelay"
version = "0.1.0"
description = "End-to-End Encrypted Chat and File Sharing Relay Application"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "CipherRelay Developer" }
]
dependencies = [
    "pynacl>=1.5.0",
    "argon2-cffi>=23.1.0",
    "websockets>=13.0",
    "cryptography>=42.0.0",
    "prompt-toolkit>=3.0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "hypothesis>=6.90.0",
    "ruff>=0.3.0",
    "bandit>=1.7.0",
    "pip-audit>=2.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cipherrelay"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["BLE001", "ASYNC230", "S110"]
